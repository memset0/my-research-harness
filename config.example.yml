# memon configuration template.
#
# This source-controlled example is maintained only through intentional Agent
# or human edits. memon runtime code never selects or writes this file. Copy it
# to an instance such as `config.yml` (gitignored), then edit `projects` to
# point at your real logs directories. Paths can be relative (resolved against
# the instance config file's directory) or absolute.
#
# `memon serve` starts the dashboard at port 3737 by default. Caddy or a
# similar reverse proxy can fan that out to a public domain.

projects:
  - name: project-a
    root: ./mock/project-a
    # Default excludes (.git, node_modules, __pycache__, .venv, venv, .cache)
    # are always applied. Entries below ADD to that set.
    exclude: []

    # Optional: map GitHub owner/repo -> a LOCAL git checkout so that GitHub
    # blob line-permalinks in rendered markdown (code-review docs, run/exp
    # READMEs, reports, digests) get a hover-preview of the referenced code,
    # read from the local repo at the permalink's commit. No GitHub network
    # access; the preview endpoint is logged-in-only. `path` is resolved
    # against this project's `root` (use "." for the project's own repo). Add
    # one entry per submodule whose code your permalinks reference, pointing
    # at the submodule's GitHub owner/repo and its working-tree path.
    #
    # github:
    #   - owner: acme            # github.com/acme/project-a
    #     repo: project-a
    #     path: .                # the project's own checkout (root repo)
    #   - owner: acme            # a submodule: github.com/acme/fsdp-ext
    #     repo: fsdp-ext
    #     path: third_party/fsdp-ext

  - name: project-b
    root: ./mock/project-b

# Polling policy. Each watched directory has its own per-path interval that
# doubles after each unchanged check, capped between min and max. Defaults
# below match the spec.
poll:
  min_interval_ms: 1000
  max_interval_ms: 300000
  backoff_factor: 2

# Browser-terminal integrations and ttyd tuning. Every field is optional;
# omit the block (or any individual field) to use the defaults shown below.
# Tmux stays enabled by default for compatibility; Herdr is opt-in.
# `pane_info_idle_poll_ms` MUST be >= `pane_info_active_poll_ms`.
#
# The `commands` sub-map overrides what gets pushed into the tmux pane after
# `tmux new-session -A -s <name> -c <cwd>`. Keys are agent kinds
# (`none | claude | codex | opencode`); values are argv arrays. Omit any
# agent key to inherit its default. `commands.none: []` keeps the legacy
# "no trailing command — just tmux's default shell" behaviour; for every
# other agent the array must be non-empty.
#
# NOTE: the resume tail (e.g. `["--continue"]` for claude when a prior
# conversation exists at <cwd>) is appended AFTER the user's argv. If you
# wrap with `bash -lc "exec claude"`, that resume tail becomes a bash
# positional arg rather than a claude flag, so auto-resume effectively
# disables itself for wrapped forms.
#
# terminal:
#   tmux_enabled: true               # set false to skip all tmux UI and commands
#   herdr:                           # omit this block to disable Herdr
#     cli: ["herdr"]                 # executable/wrapper argv; no shell parsing
#   ttyd_max_concurrent: 16          # soft LRU cap on concurrent ttyd procs
#   ttyd_idle_ttl_minutes: 30        # kill ttyd after this many idle minutes; 0 disables
#   pane_info_active_poll_ms: 5000   # per-target poll interval when ttyd is bound
#   pane_info_idle_poll_ms: 60000    # per-target poll interval otherwise; >= active
#   commands:
#     none: []                       # plain shell; tmux picks the default
#     claude: ["claude"]
#     codex: ["codex"]
#     opencode: ["opencode"]

# Slurm cluster-status widget in the sidebar footer. Opt-in: set
# `total_nodes` to the cluster's node total to enable; the widget then
# shows "<usedNodes> / total_nodes" with `squeue --me` job details on
# hover (desktop) / tap (mobile). The value `-1` (default when block is
# absent) disables the feature — no `squeue` probe, no widget, no API.
# When enabled the server refuses to start if `squeue --me` doesn't work.
#
# slurm:
#   total_nodes: 8

# Git status pill (sidebar + project-page footer). One knob drives BOTH the
# client TanStack `refetchInterval` AND the server-side per-project throttle
# window, so the two cadences cannot drift. Default 10s; floor 1s.
#
# git_status:
#   interval_ms: 10000

# Authentication for the HTTP dashboard. Leave this block COMMENTED when
# copying the template to a fresh instance — `memon serve` will generate a
# random 144-bit password on first run, persist it (PLAINTEXT) in that instance
# config, and print it to stdout once. It never persists into this template.
#
# Plaintext is intentional: the threat model is "single user, host fs trust =
# auth trust", same as having an SSH key in $HOME. Storing plaintext means
# dev agents and curl-based automation can read the password from one
# canonical source (the selected instance config) without managing a separate
# secret store.
#
# To rotate: edit `password` below to a new value and restart `memon serve`.
# To regenerate: delete the auth block entirely.
#
# CLI commands (`memon list`, `memon scan`, …) do not require auth; only the
# HTTP server does.
#
# The `session_secret` field signs the browser-facing login + share-link
# cookies (memon-session / memon-shares). It is also auto-generated on first
# run; rotating it invalidates every open browser session and every
# outstanding share-link cookie (force-logging-out viewers as well).
#
# auth:
#   username: admin
#   password: <plaintext>           # set on first run, edit to rotate
#   session_secret: <plaintext>     # 256-bit HMAC key for browser cookies;
#                                   # auto-generated on first run alongside
#                                   # `password`. Rotate to log everyone out.

# ── central / Backend roles (multi-Host) ──────────────────────
# No role block means standalone (the default represented by this file).
# A split deployment uses separate instance files: one with `central:` and no
# Project roots, and one `backend:` instance per Host with local Project roots.
# `central:` and `backend:` are mutually exclusive. Legacy `hub:` / `node:`
# blocks are rejected rather than reviving the abandoned WebSocket-RPC design.
#
# Values below are synthetic documentation placeholders only. Generate an
# independent high-entropy token for every Backend; never reuse these example
# strings. During rotation, add `next` to the Backend first, then central,
# switch `current`, verify, and finally remove the old token.
#
# Central instance (remove the top-level `projects`, polling, terminal, Slurm,
# and Git-status blocks when creating this separate instance):
#
# central:
#   bind_addr: "127.0.0.1"          # optional; default 127.0.0.1
#   bind_port: 3737                 # optional; default 3737
#   public_url: "https://central.example.test"
#   # Optional temporary migration target for legacy name-only share links.
#   # legacy_share_host: host-a
#   hosts:
#     - id: host-a
#       label: "Synthetic URL Host"
#       tokens:
#         current: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" # replace; 32+ base64url chars
#         next: "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"    # optional rotation slot
#       transport:
#         kind: url
#         base_url: "https://backend-a.example.test"
#         # Plain HTTP requires `allow_insecure_http: true` and is intended
#         # only for an explicitly trusted private/loopback transport.
#       operations:                 # optional machine-readable Agent hints
#         ssh_target: "operator@host-a.example.test"
#         checkout_path: "/example/checkouts/memon"
#         config_path: "/example/config/backend.yml"
#         runtime_bootstrap: ["memon", "backend", "daemon", "start"]
#         supervisor_mode: supervised
#
#     - id: host-b
#       label: "Synthetic SSH Host"
#       tokens:
#         current: "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC" # replace independently
#       transport:
#         kind: ssh
#         executable: "ssh"         # optional; default ssh
#         target: "tunnel@host-b.example.test"
#         known_hosts_file: "/example/secrets/known_hosts"
#         identity_file: "/example/secrets/id_host_b" # optional
#         local_port: 4738           # unique center-loopback forward
#         remote_host: "127.0.0.1"  # optional; default loopback
#         remote_port: 3738
#
# Backend instance (keep this Host's `projects` and cluster-local settings):
#
# backend:
#   host_id: host-a
#   access_mode: read_write          # read_only for private shadow verification
#   bind_addr: "127.0.0.1"          # optional; default 127.0.0.1
#   bind_port: 3738                 # optional; default 3738
#   tokens:
#     current: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" # matches only Host A
#     next: "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"    # optional rotation slot
#   daemon:
#     mode: supervised              # supervised | foreground | external
#     state_dir: "/example/state/memon"
#     release_dir: "/example/releases/memon"
#     runtime_dir: "/example/run/memon" # must be node-local, not shared NFS
#     guards:
#       allowed_hostnames: ["login-*.example.test"]
#       forbidden_env: ["SLURM_JOB_ID", "PBS_JOBID"]
#     # `restart_argv` is accepted only with mode: external. If omitted, an
#     # update reports restart_required instead of guessing service-manager UX.
#     # restart_argv: ["service-wrapper", "restart"]
#
# Keep real Host IDs, domains, addresses, ports, SSH identities, paths, tokens,
# and operational notes only in Git-ignored instance files. Narrative runbooks
# belong in YAML comments beside the relevant local Host entry.
