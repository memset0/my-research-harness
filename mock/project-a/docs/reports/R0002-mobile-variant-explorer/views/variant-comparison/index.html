<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Variant comparison</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }

      main {
        width: 100%;
        padding: clamp(0.75rem, 3vw, 1.5rem);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.1rem, 4vw, 1.5rem);
      }

      .source,
      #status {
        color: GrayText;
        font-size: 0.8rem;
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(0, 18rem) 1fr;
        align-items: end;
        gap: 0.75rem;
        margin-block: 1rem;
      }

      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.8rem;
        font-weight: 600;
      }

      select {
        min-height: 44px;
        width: 100%;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-radius: 0.4rem;
        background: Canvas;
        color: CanvasText;
        padding-inline: 0.65rem;
        font: inherit;
      }

      .table-region {
        max-width: 100%;
        overflow-x: auto;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 0.5rem;
        overscroll-behavior-inline: contain;
      }

      table {
        width: 100%;
        min-width: 42rem;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      th,
      td {
        padding: 0.65rem 0.75rem;
        border-bottom: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
        text-align: right;
        white-space: nowrap;
      }

      th:first-child,
      td:first-child,
      th:nth-child(2),
      td:nth-child(2) {
        text-align: left;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      @media (max-width: 600px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Variant comparison</h1>
      <p class="source">Source: synthetic browser fixture</p>
      <div class="controls">
        <label>
          Precision
          <select id="precision">
            <option value="">All precisions</option>
          </select>
        </label>
        <p id="status" role="status" aria-live="polite">Loading Variant data…</p>
      </div>
      <div class="table-region" tabindex="0" aria-label="Scrollable Variant comparison table">
        <table>
          <thead>
            <tr>
              <th scope="col">Variant</th>
              <th scope="col">Name</th>
              <th scope="col">Precision</th>
              <th scope="col">Batch size</th>
              <th scope="col">Final loss</th>
              <th scope="col">Throughput</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <noscript>This view requires JavaScript. Inspect ../../data/variants.json for the source data.</noscript>
    </main>
    <script type="module">
      const precision = document.querySelector('#precision')
      const rows = document.querySelector('#rows')
      const status = document.querySelector('#status')

      try {
        const response = await fetch('../../data/variants.json')
        if (!response.ok) throw new Error(`HTTP ${response.status}`)
        const payload = await response.json()
        const variants = payload.variants

        for (const value of [...new Set(variants.map((variant) => variant.precision))].sort()) {
          precision.add(new Option(value, value))
        }

        const render = () => {
          const visible = variants.filter(
            (variant) => !precision.value || variant.precision === precision.value,
          )
          rows.replaceChildren(
            ...visible.map((variant) => {
              const row = document.createElement('tr')
              for (const value of [
                variant.id,
                variant.name,
                variant.precision,
                variant.batch_size,
                variant.final_loss.toFixed(3),
                `${variant.throughput.toFixed(1)} samples/s`,
              ]) {
                const cell = document.createElement('td')
                cell.textContent = value
                row.append(cell)
              }
              return row
            }),
          )
          status.textContent = `${visible.length} of ${variants.length} Variants shown`
        }

        precision.addEventListener('change', render)
        render()
      } catch (error) {
        status.textContent = `Could not load Variant data: ${error.message}`
      }
    </script>
  </body>
</html>
