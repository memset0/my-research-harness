<!doctype html>
<html><head><meta charset="utf-8"><title>EDM2 explorer</title>
<style>body{font:14px system-ui;margin:16px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 8px}</style></head>
<body><h1>EDM2 vs Karras-EDM explorer</h1><p>Loads <code>../../data/fid.csv</code> relative to this view.</p>
<table id="t"><thead><tr><th>step</th><th>precond</th><th>fid</th></tr></thead><tbody></tbody></table>
<script>
fetch('../../data/fid.csv').then(r=>r.text()).then(t=>{const b=document.querySelector('#t tbody');
for(const l of t.trim().split('\n').slice(1)){const tr=document.createElement('tr');for(const c of l.split(',')){const td=document.createElement('td');td.textContent=c;tr.appendChild(td);}b.appendChild(tr);}});
</script></body></html>
