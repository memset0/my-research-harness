<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title description">
  <title id="title">Processing pipeline</title>
  <desc id="description">Input flows through Process to Output in three connected boxes.</desc>
  <rect width="640" height="180" rx="12" fill="#f1f5f9"/>
  <g fill="#ffffff" stroke="#475569" stroke-width="2">
    <rect x="24" y="48" width="160" height="84" rx="8"/>
    <rect x="240" y="48" width="160" height="84" rx="8"/>
    <rect x="456" y="48" width="160" height="84" rx="8"/>
  </g>
  <g fill="none" stroke="#0f766e" stroke-width="3">
    <path d="M184 90h48m-10-8 10 8-10 8"/>
    <path d="M400 90h48m-10-8 10 8-10 8"/>
  </g>
  <g fill="#0f172a" font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="104" y="98">Input</text>
    <text x="320" y="98">Process</text>
    <text x="536" y="98">Output</text>
  </g>
</svg>
